name: Deploy VuePress Docs to gh-pages Branch

on:
  push:
    branches:
      - main # Adjust to master if needed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Option A (isolated docs/package.json — default):
          cache-dependency-path: docs/package-lock.json

      # Option A (isolated docs/package.json — default):
      - name: Install dependencies and build docs
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

      # Option B (root package.json) — remove cache-dependency-path above and replace step with:
      # - name: Install dependencies and build docs
      #   run: |
      #     npm ci
      #     npm run docs:build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/.vuepress/dist
          force_orphan: true
