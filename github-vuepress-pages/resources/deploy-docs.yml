name: Deploy VuePress Docs to GitHub Pages

on:
  push:
    branches:
      - main # Adjust to master if needed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Option A (isolated docs/package.json — default):
          cache-dependency-path: docs/package-lock.json

      # Option A (isolated docs/package.json — default):
      - name: Install dependencies and build docs
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

      # Option B (root package.json) — remove cache-dependency-path above and replace step with:
      # - name: Install dependencies and build docs
      #   run: |
      #     npm ci
      #     npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
